name: manual_run

on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Test to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - load
          - api
          - stress

jobs:
  k6:
    name: Run k6 tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set test file
        id: set-test
        run: |
          TEST="${{ github.event.inputs.test || 'smoke' }}"
          echo "file=tests/${TEST}.js" >> $GITHUB_OUTPUT
          echo "name=${TEST}" >> $GITHUB_OUTPUT

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6
        uses: grafana/run-k6-action@v1
        env:
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
          K6_CLOUD_PROJECT_ID: 7096245
        with:
          path: ${{ steps.set-test.outputs.file }}
